# Override para el despliegue (CD): usa las imágenes empaquetadas por el
# pipeline (etiquetadas con el SHA del commit) en lugar de construirlas,
# garantizando que se despliega exactamente el artefacto verificado.
services:
  cuidarteplus-backend-ev:
    image: cuidarte-mas-backend:${IMAGE_TAG:?definir IMAGE_TAG}
    pull_policy: never
  cuidarteplus-frontend-ev:
    image: cuidarte-mas-frontend:${IMAGE_TAG:?definir IMAGE_TAG}
    pull_policy: never
