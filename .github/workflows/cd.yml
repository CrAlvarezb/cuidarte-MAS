# =====================================================================
#  Pipeline de ENTREGA CONTINUA (CD) - Cuidarte+
#  Se ejecuta SOLO si el pipeline de CI terminó con éxito en main
#  (es decir, si el Quality Gate aprobó), o manualmente (workflow_dispatch).
#  Etapas:
#   1. Empaquetado: construye las imágenes Docker, las etiqueta con el
#      SHA del commit (trazabilidad / rollback) y las publica como
#      artefacto versionado del pipeline.
#   2. Despliegue a staging: environment "staging" (puede exigir
#      aprobación manual en Settings > Environments), despliega
#      EXACTAMENTE las imágenes empaquetadas y ejecuta un smoke test.
# =====================================================================
name: CD - Entrega continua

on:
  workflow_run:
    workflows: ["CI - Build y Pruebas"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Empaquetar imágenes (tag = SHA)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Metadatos
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build imagen backend
        run: |
          docker build --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "cuidarte-mas-backend:${{ steps.meta.outputs.tag }}" BACKEND
      - name: Build imagen frontend
        run: |
          docker build --build-arg VITE_API_URL=http://localhost:4444 \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "cuidarte-mas-frontend:${{ steps.meta.outputs.tag }}" FRONTEND
      - name: Exportar imágenes y checksum
        run: |
          mkdir -p dist
          docker save "cuidarte-mas-backend:${{ steps.meta.outputs.tag }}" \
                      "cuidarte-mas-frontend:${{ steps.meta.outputs.tag }}" | gzip > dist/imagenes.tar.gz
          (cd dist && sha256sum imagenes.tar.gz > imagenes.sha256)
          {
            echo "### Imágenes empaquetadas (tag ${{ steps.meta.outputs.tag }})"
            echo "- cuidarte-mas-backend:${{ steps.meta.outputs.tag }}"
            echo "- cuidarte-mas-frontend:${{ steps.meta.outputs.tag }}"
            echo "- Tamaño: $(du -h dist/imagenes.tar.gz | cut -f1) · SHA-256: \`$(cut -d' ' -f1 dist/imagenes.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: imagenes-${{ steps.meta.outputs.tag }}
          path: dist/
          retention-days: 14

  deploy-staging:
    name: Desplegar en staging + smoke test
    runs-on: ubuntu-latest
    needs: package
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: imagenes-${{ needs.package.outputs.tag }}
          path: dist
      - name: Verificar integridad y cargar imágenes
        run: |
          (cd dist && sha256sum -c imagenes.sha256)
          gunzip -c dist/imagenes.tar.gz | docker load
      - name: Desplegar imágenes empaquetadas (sin reconstruir)
        env:
          IMAGE_TAG: ${{ needs.package.outputs.tag }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$JWT_SECRET" ]; then export JWT_SECRET=$(openssl rand -hex 32); fi
          docker compose -f docker-compose.yml -f deploy/docker-compose.staging.yml up -d --no-build
          docker compose -f docker-compose.yml -f deploy/docker-compose.staging.yml ps
      - name: Smoke test
        run: |
          for i in $(seq 1 60); do curl -fs http://localhost:4444/ && break; sleep 3; done
          curl -fs http://localhost:4444/ | grep -q '"status":"ok"'
          curl -fs http://localhost:3333/ | grep -qi '<div id="root"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:4444/autenticacion/login \
                 -H 'Content-Type: application/json' -d '{"nombre_usuario":"admin","password":"admin"}')
          [ "$code" = "200" ]
          {
            echo "### Smoke test OK"
            echo "| Verificación | Resultado |"
            echo "|---|---|"
            echo "| API GET / | 200 status ok |"
            echo "| Frontend GET / | 200 (SPA) |"
            echo "| Login admin | $code |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Rollback ante fallo
        if: failure()
        run: |
          echo "::error::Smoke test fallido: se detiene el despliegue (rollback a la versión anterior)."
          docker compose -f docker-compose.yml -f deploy/docker-compose.staging.yml logs || true
      - name: Detener entorno
        if: always()
        run: docker compose down -v
